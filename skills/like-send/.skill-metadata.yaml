examples:
- id: draft-like
  title:
    zh: 起草点赞
    en: 起草点赞
  description:
    zh: 核对人员并起草中文点赞，按明确指令发送一次，简洁展示草稿、发送结果或本人历史
    en: 核对人员并起草中文点赞，按明确指令发送一次，简洁展示草稿、发送结果或本人历史
  prompt:
    zh: 使用 $like-send，为指定同事起草点赞，使用我提供的事实，本次只展示草稿。
    en: 使用 $like-send，为指定同事起草点赞，使用我提供的事实，本次只展示草稿。
- id: sent-likes
  title:
    zh: 查看本人记录
    en: 查看本人记录
  description:
    zh: 核对人员并起草中文点赞，按明确指令发送一次，简洁展示草稿、发送结果或本人历史
    en: 核对人员并起草中文点赞，按明确指令发送一次，简洁展示草稿、发送结果或本人历史
  prompt:
    zh: 使用 $like-send，查看我发出的点赞记录，先查5条，用中文展示接收人、内容和时间。
    en: 使用 $like-send，查看我发出的点赞记录，先查5条，用中文展示接收人、内容和时间。
