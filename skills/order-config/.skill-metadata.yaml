examples:
- id: store-config
  title:
    zh: 查询单店配置
    en: 查询单店配置
  description:
    zh: 查询或比较选定门店的起订量、订货倍数与库存上下限，用中文说明当前配置及缺项
    en: 查询或比较选定门店的起订量、订货倍数与库存上下限，用中文说明当前配置及缺项
  prompt:
    zh: 使用 $order-config，查询已确认门店里指定品项的起订量、订货倍数和可订货状态。
    en: 使用 $order-config，查询已确认门店里指定品项的起订量、订货倍数和可订货状态。
- id: compare-config
  title:
    zh: 比较门店配置
    en: 比较门店配置
  description:
    zh: 查询或比较选定门店的起订量、订货倍数与库存上下限，用中文说明当前配置及缺项
    en: 查询或比较选定门店的起订量、订货倍数与库存上下限，用中文说明当前配置及缺项
  prompt:
    zh: 使用 $order-config，比较我选定门店中同一品项的当前订货配置，用中文说明差异和单位。
    en: 使用 $order-config，比较我选定门店中同一品项的当前订货配置，用中文说明差异和单位。
