examples:
- id: current-price
  title:
    zh: 当前有效采购价
    en: 当前有效采购价
  description:
    zh: 按名称或类别查询全部可查范围的有效采购价，保留规格单位，用中文表格展示结果
    en: 按名称或类别查询全部可查范围的有效采购价，保留规格单位，用中文表格展示结果
  prompt:
    zh: 使用 $purchase-price，查询测试环境中指定品项的当前有效采购价，先查5条，用中文表格展示。
    en: 使用 $purchase-price，查询测试环境中指定品项的当前有效采购价，先查5条，用中文表格展示。
- id: category-price
  title:
    zh: 虾的有效采购价
    en: 虾的有效采购价
  description:
    zh: 按名称或类别查询全部可查范围的有效采购价，保留规格单位，用中文表格展示结果
    en: 按名称或类别查询全部可查范围的有效采购价，保留规格单位，用中文表格展示结果
  prompt:
    zh: 使用 $purchase-price，看看测试环境最近虾的有效采购价，先查5条。只看原虾和虾仁，不含制品或调味料。
    en: 使用 $purchase-price，看看测试环境最近虾的有效采购价，先查5条。只看原虾和虾仁，不含制品或调味料。
- id: pork-prices
  title:
    zh: 猪肉有效采购价
    en: 猪肉有效采购价
  description:
    zh: 区分食材与制品，合并候选批量查询全部可查范围采购价，用中文展示价格和必要口径
    en: 区分食材与制品，合并候选批量查询全部可查范围采购价，用中文展示价格和必要口径
  prompt:
    zh: 使用 $purchase-price，看看测试环境最近猪肉的有效采购价，先查5条，查询本人全部可查范围。
    en: 使用 $purchase-price，看看测试环境最近猪肉的有效采购价，先查5条，查询本人全部可查范围。
