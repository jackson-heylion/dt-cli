examples:
- id: inspect-interface
  title:
    zh: 核对查询能力
    en: 核对查询能力
  description:
    zh: 安装和登录客户端，规划查询并核对权限，受控执行与恢复任务，统一中文业务表达
    en: 安装和登录客户端，规划查询并核对权限，受控执行与恢复任务，统一中文业务表达
  prompt:
    zh: 使用 $dt-cli，核对已确认业务查询需要的接口与筛选能力。
    en: 使用 $dt-cli，核对已确认业务查询需要的接口与筛选能力。
- id: configure-interface
  title:
    zh: 配置开放平台接口
    en: 配置开放平台接口
  description:
    zh: 安装和登录客户端，规划查询并核对权限，受控执行与恢复任务，统一中文业务表达
    en: 安装和登录客户端，规划查询并核对权限，受控执行与恢复任务，统一中文业务表达
  prompt:
    zh: 使用 $dt-cli，为已指定接口生成接入计划，限定本次明确授权的环境、接口和对象。
    en: 使用 $dt-cli，为已指定接口生成接入计划，限定本次明确授权的环境、接口和对象。
