name: Native build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts to the configured Qiniu stable channel
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: dt-cli-native-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - name: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check Rust toolchain and add native target
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native-nodebug-${{ matrix.target }}-rust-1.94.1
          cache-workspace-crates: "false"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Test library, credentials and executable contracts in one Cargo build
        run: cargo test --locked --lib --test native_store --test governed_contract --test process_contract --test login_callbacks -- --test-threads=1
      - name: Test installation and packaging
        run: |
          python3 -m pip install -r scripts/release/requirements.txt
          python3 -m unittest discover -s tests/release -v
      - name: Build and verify actual native package
        run: python3 scripts/release/native_ci.py --target ${{ matrix.target }} --name ${{ matrix.name }}
      - name: Export universal Skill package
        run: python3 scripts/release/package_skill.py --output output/native/dt-cli-skill.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dt-cli-${{ matrix.name }}-${{ github.sha }}
          path: output/native/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: dt-cli-*-${{ github.sha }}
          path: output/artifacts
      - name: Validate all three native targets and assemble distribution
        run: python3 scripts/release/index.py --artifacts output/artifacts --output output/distribution --sequence ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dt-cli-distribution-${{ github.sha }}
          path: output/distribution/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: assemble
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/native-publish.yml
    with:
      source_commit: ${{ github.sha }}
      run_id: ${{ github.run_id }}
    secrets: inherit
