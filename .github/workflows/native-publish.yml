name: Publish and verify native distribution

on:
  workflow_call:
    inputs:
      source_commit:
        type: string
        required: true
      run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Hold the shared lock from upload until all public installation checks finish.
concurrency:
  group: dt-cli-native-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dt-cli-distribution-${{ inputs.source_commit }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: output/distribution
      - name: Match immutable distribution to the validated source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          tree = pathlib.Path('output/distribution')
          stable = json.loads((tree / 'channels/native-stable.json').read_bytes())
          assert stable['releaseKey'] == 'releases/' + stable['version'] + '/native-release.json'
          raw = (tree / stable['releaseKey']).read_bytes()
          assert hashlib.sha256(raw).hexdigest() == stable['releaseSha256']
          assert json.loads(raw)['buildCommit'] == os.environ['SOURCE_COMMIT']
          PYTHON
      - name: Install pinned upload SDK
        run: python3 -m pip install -r scripts/release/requirements.txt
      - name: Publish immutable packages and switch stable last
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          QINIU_REGION: ${{ vars.QINIU_REGION }}
          QINIU_PUBLIC_BASE_URL: ${{ vars.QINIU_PUBLIC_BASE_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/release/publish_qiniu.py --tree output/distribution
      - name: Publish matching universal Skill before public installation checks
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          QINIU_REGION: ${{ vars.QINIU_REGION }}
          QINIU_PUBLIC_BASE_URL: ${{ vars.QINIU_PUBLIC_BASE_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/release/publish_skill.py --output output/skill-distribution

  verify-public:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
          - runner: macos-26-intel
          - runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install and check actual public Skill and CLI
        run: python3 scripts/release/verify_public.py
      - name: Verify original Skill and CLI upgrade compatibility
        if: ${{ matrix.runner != 'macos-26-intel' }}
        run: python3 scripts/release/verify_public.py --legacy-skill
