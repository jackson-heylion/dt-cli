name: Publish verified artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Native build run with successful platform and assemble jobs
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Validate source run and successful native evidence
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['RUN_ID']
          assert re.fullmatch(r'[0-9]+', run_id)
          prefix = 'repos/' + os.environ['REPOSITORY'] + '/actions/runs/' + run_id
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          run = api(prefix)
          assert run['path'] == '.github/workflows/native-build.yml'
          assert run['head_branch'] == 'main' and run['event'] == 'workflow_dispatch'
          assert run['head_repository']['full_name'] == os.environ['REPOSITORY']
          jobs = api(prefix + '/jobs')['jobs']
          for name in ('macos-arm64', 'macos-x64', 'windows-x64', 'assemble'):
              matching = [job for job in jobs if job['name'] == name]
              assert len(matching) == 1 and matching[0]['conclusion'] == 'success'
          assert re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + run['head_sha'] + '\n')
          PY

  publish:
    needs: validate
    uses: ./.github/workflows/native-publish.yml
    with:
      source_commit: ${{ needs.validate.outputs.commit }}
      run_id: ${{ inputs.run_id }}
    secrets: inherit
