name: Universal Skill release

on:
  workflow_dispatch:
    inputs:
      repair_stable_cache:
        description: Repair client cache headers for the already published stable Skill
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dt-cli-native-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned release dependencies
        run: python3 -m pip install -r scripts/release/requirements.txt
      - name: Check universal package and publication behavior
        run: python3 -m unittest discover -s tests/release -p 'test_skill_*.py' -v
      - name: Publish universal Skill and switch Skill channel last
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          QINIU_REGION: ${{ vars.QINIU_REGION }}
          QINIU_PUBLIC_BASE_URL: ${{ vars.QINIU_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ inputs.repair_stable_cache }}" = "true" ]; then
            python3 scripts/release/publish_skill.py --repair-stable-cache
          else
            python3 scripts/release/publish_skill.py --output output/skill-distribution
          fi

  verify-public:
    if: ${{ !inputs.repair_stable_cache }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify universal public Skill with current stable CLI
        run: python3 scripts/release/verify_public.py --skill-only
