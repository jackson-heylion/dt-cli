name: Verify published release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full GitHub source commit of the already published CLI and Skill
        type: string
        required: true
      independent_skill:
        description: Verify a separately published dt-cli Skill with the current stable CLI
        type: boolean
        default: false
      refresh_compatibility_cache:
        description: Refresh fixed historical upgrade fixtures without uploading or switching stable
        type: boolean
        default: false
      historical_upgrades:
        description: Also verify old versions (requires retained historical packages)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dt-cli-native-release
  cancel-in-progress: false

jobs:
  refresh-compatibility-cache:
    if: ${{ inputs.refresh_compatibility_cache && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned release dependencies
        run: python3 -m pip install -r scripts/release/requirements.txt
      - name: Refresh only historical compatibility fixture caches
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          QINIU_REGION: ${{ vars.QINIU_REGION }}
          QINIU_PUBLIC_BASE_URL: ${{ vars.QINIU_PUBLIC_BASE_URL }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/release/refresh_compatibility_cache.py

  verify:
    needs: refresh-compatibility-cache
    if: ${{ !cancelled() && (needs.refresh-compatibility-cache.result == 'success' || needs.refresh-compatibility-cache.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DT_CLI_EXPECTED_COMMIT: ${{ inputs.source_commit }}
      DT_CLI_HISTORICAL_UPGRADES: ${{ inputs.historical_upgrades }}
      DT_CLI_INDEPENDENT_SKILL: ${{ inputs.independent_skill }}
    steps:
      - name: Validate published source commit
        shell: bash
        run: |
          if [[ ! "$DT_CLI_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase commit SHA."
            exit 2
          fi
          if [[ "$DT_CLI_INDEPENDENT_SKILL" = "true" && "$DT_CLI_HISTORICAL_UPGRADES" = "true" ]]; then
            echo "Independent Skill verification requires historical_upgrades=false."
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.independent_skill && inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify public bytes, provenance, installs and old-client upgrades
        shell: bash
        run: |
          if [ "$DT_CLI_INDEPENDENT_SKILL" = "true" ]; then
            python3 scripts/release/verify_public.py --skill-only
          elif [ "$DT_CLI_HISTORICAL_UPGRADES" = "true" ]; then
            python3 scripts/release/verify_public.py --skill-only --expected-commit "$DT_CLI_EXPECTED_COMMIT" --historical-upgrades
          else
            python3 scripts/release/verify_public.py --skill-only --expected-commit "$DT_CLI_EXPECTED_COMMIT"
          fi
      - name: Verify original Skill and CLI upgrade compatibility
        if: ${{ !inputs.independent_skill && inputs.historical_upgrades && matrix.runner != 'macos-26-intel' }}
        shell: bash
        run: python3 scripts/release/verify_public.py --legacy-skill --expected-commit "$DT_CLI_EXPECTED_COMMIT"
