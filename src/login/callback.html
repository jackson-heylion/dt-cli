<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <title>{{title}} · dt-cli</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: #17243b;
        background: #f4f6fa;
        --accent: #315ee7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        line-height: 1.65;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #f4f6fa;
        background: #17243b;
        padding: 22px max(24px, calc((100vw - 1120px) / 2));
        font-size: 18px;
        font-weight: 650;
      }
      .brand svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: #c5d2fa;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand span {
        border-left: 1px solid #6a7a98;
        padding-left: 14px;
        font-size: 13px;
        font-weight: 400;
        color: #d0d9ed;
      }
      main {
        width: min(520px, calc(100% - 32px));
        margin: auto;
        padding: 56px 0;
      }
      article {
        padding: 40px;
        background: white;
        border: 1px solid #dce2ec;
        border-radius: 12px;
      }
      .result {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        background: #e9efff;
        color: #315ee7;
        border-radius: 50%;
        margin-bottom: 28px;
      }
      .result svg {
        width: 28px;
        height: 28px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .error .result {
        background: #fbe9e5;
        color: #a0392e;
      }
      h1 {
        font-size: 30px;
        line-height: 1.3;
        letter-spacing: -0.025em;
        margin: 0 0 16px;
        font-weight: 650;
        text-wrap: balance;
      }
      p {
        font-size: 16px;
        color: #5b677d;
        margin: 0;
        max-width: 65ch;
      }
      .next {
        border-top: 1px solid #dce2ec;
        padding-top: 24px;
        margin-top: 28px;
      }
      .next strong {
        display: block;
        font-size: 16px;
        margin-bottom: 8px;
      }
      .next p {
        font-size: 14px;
      }
      footer {
        padding: 24px;
        text-align: center;
        font-size: 12px;
        color: #5b677d;
      }
      ::selection {
        background: #dce5ff;
        color: #203e8b;
      }
      @media (max-width: 600px) {
        .brand {
          padding: 20px;
        }
        article {
          padding: 28px;
        }
        h1 {
          font-size: 26px;
        }
        main {
          padding: 40px 0;
        }
        .result {
          margin-bottom: 24px;
        }
      }
      @media print {
        body {
          background: white;
        }
        .brand {
          background: white;
          color: #17243b;
        }
        main {
          margin: 24px auto;
        }
        footer {
          display: none;
        }
      }
    </style>
  </head>
  <body class="{{state}}">
    <header class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m4 6 6 6-6 6m10 0h6" /></svg
      >dt-cli <span>本人身份验证</span>
    </header>
    <main>
      <article>
        <div class="result" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="{{icon}}" /></svg>
        </div>
        <h1>{{title}}</h1>
        <p>{{message}}</p>
        <div class="next">
          <strong>{{next}}</strong>
          <p>{{detail}}</p>
        </div>
      </article>
    </main>
    <footer>dt-cli · 以本人身份，完成日常工作</footer>
  </body>
</html>
