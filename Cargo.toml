[package]
name = "dt-cli"
version = "0.5.1"
edition = "2024"
rust-version = "1.94"
build = "build.rs"

[features]
local-dev = []

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12.1"
base64 = "0.22"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
directories = "6"
webbrowser = "1"
zeroize = { version = "1", features = ["derive"] }
jsonschema = { version = "0.57.0", default-features = false }
tempfile = "3"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
